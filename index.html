<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط شركة CME للهندسة البحرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #2c2c2c 0%, #1a1a1a 100%);
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .metal-card {
            background: linear-gradient(145deg, #3d3d3d, #252525);
            border: 1px solid #b8860b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 20px;
        }
        .link-btn {
            background: rgba(184, 134, 11, 0.1);
            border: 1px solid rgba(184, 134, 11, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
        }
        .link-btn:hover {
            background: #b8860b;
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.4);
        }
        .logo-glow {
            filter: drop-shadow(0 0 10px rgba(184, 134, 11, 0.5));
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full text-center metal-card p-8">
        <!-- Logo Section -->
        <div class="mb-6">
            <div class="w-32 h-32 mx-auto mb-4 logo-glow bg-zinc-800 rounded-full flex items-center justify-center border-2 border-[#b8860b]">
                <span class="text-3xl font-bold text-[#b8860b]">CME</span>
            </div>
            <h1 class="text-2xl font-bold text-[#b8860b]">Commands Marine Engineering</h1>
            <p class="text-sm text-gray-400 mt-2">الهندسة البحرية كما يجب أن تكون</p>
        </div>

        <!-- Links Section -->
        <div class="flex flex-col">
            <a href="https://facebook.com/CME_Egypt" class="link-btn">
                <i class="fab fa-facebook-f ml-3"></i> فيسبوك - Facebook
            </a>
            
            <a href="https://instagram.com/CME_Egypt" class="link-btn">
                <i class="fab fa-instagram ml-3"></i> انستجرام - Instagram
            </a>

            <a href="https://linkedin.com/company/cme-egypt" class="link-btn">
                <i class="fab fa-linkedin-in ml-3"></i> لينكد إن - LinkedIn
            </a>

            <a href="https://tiktok.com/@CME_Egypt" class="link-btn">
                <i class="fab fa-tiktok ml-3"></i> تيك توك - TikTok
            </a>

            <a href="mailto:commandsmarineengineeringcme@gmail.com" class="link-btn">
                <i class="fas fa-envelope ml-3"></i> البريد الإلكتروني
            </a>
            
            <a href="tel:+201000000000" class="link-btn bg-[#b8860b] text-black">
                <i class="fas fa-phone-alt ml-3"></i> اتصل بنا الآن
            </a>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-xs text-gray-500">
            &copy; 2026 CME Marine Engineering. جميع الحقوق محفوظة.
        </div>
    </div>

</body>
</html>
